# ============================================================
#  offsets.ini  -  per-Roblox-version values
# ============================================================
# Numeric values are HEX (0x prefix optional).
# Filled from the supplied x64 dump. Re-verify with `external.exe --dump`
# after any Roblox update; offsets change constantly.
#
# Globals are module-relative (RVA) and are added to the module base.
# You may instead give a byte signature via "<name>_sig" (IDA style, ? = wildcard).

[globals]
fake_data_model = 0x8e16368
visual_engine = 0x8896b98
fake_to_datamodel = 0x1f8
# TaskScheduler fallback path (jobs -> RenderJob -> RealDataModel).
task_scheduler = 0x8da5d98
ts_job_start = 0xc8
ts_job_end = 0xd0
ts_job_name = 0x18
render_job_real_datamodel = 0x1f0

[instance]
# x64 std::vector<Instance*> = begin/end/capacity at +0x0/+0x8/+0x10.
# The dump's "ChildrenEnd = 0x8" is a delta, so end = 0x70 + 0x8.
instance_children_start = 0x70
instance_children_end = 0x78
# NameContainer pointer (0x68), string at +Name (0x0), length at +0x10.
instance_name = 0x68
instance_name_offset = 0x0
instance_class_descriptor = 0x18
class_descriptor_name = 0x8

[player]
player_character = 0x2a0
player_team = 0x2e0
players_local_player = 0x118

[humanoid]
humanoid_health = 0x184
humanoid_max_health = 0x1a0

[part]
# BasePart -> Primitive -> Position/Size (takes priority when set).
basepart_primitive = 0x178
primitive_position = 0xd4
primitive_size = 0x1c4
# Direct fallback for older layouts (unused while basepart_primitive is set).
part_position = 0x0
part_size = 0x0

[workspace]
workspace_camera = 0x4a0

[visual_engine]
view_matrix = 0x1b0
dimensions = 0xb10
